{% load static %}
<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sarkin Mota Autos | Entrance</title>
    <style>
        /* BASE APPLICATON RESET */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: -webkit-fill-available;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            position: relative;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        /* HARDWARE ACCELERATED BACKGROUND CINEMATICS */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available; 
            object-fit: cover;
            object-position: center;
            z-index: 0;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 1;
        }

        /* NAVIGATION HEADER WRAPPER */
        .custom-navbar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            padding: 25px 5%; 
            background-color: transparent; 
            position: absolute; 
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .navbar-logo {
            color: #ffcc00;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
            margin: 0;
            order: 2; /* Logo sticks cleanly to the right */
        }

        .hamburger-toggle {
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            margin: 0;
            order: 1; /* Hamburger button sticks cleanly to the left */
        }

        .hamburger-toggle .bar {
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* DESKTOP VIEW DROPDOWN MENU CONFIGURATION */
        .nav-menu {
            display: none; 
            flex-direction: column;
            position: absolute;
            top: 100%;       
            left: 5%;       /* Drops straight down below your toggle button */
            width: 240px;    
            background-color: rgba(17, 17, 17, 0.95); 
            padding: 8px 0;
            border-radius: 6px; 
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.7);
            border: 1px solid #222222;
            margin-top: 10px;
            z-index: 1001;
        }

        .nav-menu.active {
            display: flex;
        }

        .nav-menu .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            padding: 12px 20px;
            text-align: left; 
            display: block;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .nav-menu .nav-link:hover {
            color: #ffcc00;
            background-color: #222222; 
        }

        /* MAIN HERO TEXT CONTENT */
        .brand-header {
            text-align: center;
            opacity: 0;
            animation: fadeInFromTop 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 2;
            margin-bottom: 50px;
        }

        .gold-text {
            color: #BF953F; 
            font-size: 4rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 700;
            text-shadow: 0 0 35px rgba(191, 149, 63, 0.3);
        }

        .sub-text {
            color: #ffffff;
            letter-spacing: 6px;
            margin-top: 15px;
            text-transform: uppercase;
            font-size: 1rem;
            opacity: 0.8;
        }

        /* PREMIUM ACTION INTERACTION HOVER BUTTONS */
        .enter-btn {
            padding: 18px 60px;
            background: transparent;
            color: #BF953F;
            border: 1px solid #BF953F;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            animation: fadeIn 1.2s ease 1.2s forwards;
            cursor: pointer;
            z-index: 2;
            border-radius: 4px;
            backdrop-filter: blur(5px); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .enter-btn:hover {
            background: #BF953F;
            color: #000;
            box-shadow: 0 0 40px rgba(191, 149, 63, 0.6);
            transform: scale(1.05) translateY(-2px);
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes fadeInFromTop {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* COMPACT SCREEN MEDIA VIEWPORT MEDIA LAYOUT (TABLETS, SPLIT SCREENS & PHONES) */
        @media (max-width: 768px) {
            .video-background {
                object-position: 32% center; 
            }
            .gold-text { 
                font-size: 2.5rem; 
                letter-spacing: 6px; 
            }
            .sub-text {
                font-size: 0.85rem;
                letter-spacing: 4px;
            }
            .enter-btn {
                padding: 14px 45px;
                font-size: 0.85rem;
                letter-spacing: 3px;
            }
            
            /* FLOATING INTERACTION GLASS DRAWER RULES */
            .nav-menu {
                left: 5%;
                width: 90%; /* Floating card design centered with breathing room on sides */
                border-radius: 8px;
                border: 1px solid #222222;
                margin-top: 15px;
                background-color: rgba(15, 15, 15, 0.97);
                box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.8);
            }

            .nav-menu .nav-link {
                text-align: center; /* Sleek centered text links alignment */
                padding: 16px 0;
                font-size: 16px;
                border-bottom: 1px solid #222222;
            }

            .nav-menu .nav-link:last-child {
                border-bottom: none; /* Removes unnecessary bottom border line from last row */
            }
        }
    </style>
</head>
<body>

    <nav class="custom-navbar">
        <button class="hamburger-toggle" id="hamburgerBtn" aria-label="Toggle navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <a href="/" class="navbar-logo">SARKIN MOTA AUTOS</a>

        <div class="nav-menu" id="navMenu">
            <a href="{% url 'car_list' %}" class="nav-link">Explore Here</a>
            <a href="#about" class="nav-link">About Us</a>
            <a href="#contact" class="nav-link">Contact Us</a>
        </div>
    </nav>

    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/74/74-720.mp4" type="video/mp4">
    </video>
    
    <div class="video-overlay"></div>

    <div class="brand-header">
        <h1 class="gold-text">Sarkin Mota</h1>
        <p class="sub-text">Premium Auto Dealership</p>
    </div>

    <a href="{% url 'car_list' %}" class="enter-btn">Enter Showroom</a>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const navMenu = document.getElementById('navMenu');

            hamburgerBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                navMenu.classList.toggle('active');
            });
            
            document.addEventListener('click', function(event) {
                if (!hamburgerBtn.contains(event.target) && !navMenu.contains(event.target)) {
                    navMenu.classList.remove('active');
                }
            });
        });
    </script>  
</body>
</html>
