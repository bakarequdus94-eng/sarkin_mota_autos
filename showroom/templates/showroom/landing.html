{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sarkin Mota Autos | Entrance</title>
    <style>
        /* Force html and body to lock down to the device boundaries tightly */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: -webkit-fill-available; /* Fixes mobile address bar shifting */
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            position: relative;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        /* FIXED ASPECT RATIO COVER LAYOUT */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available; /* Enforces absolute full browser panel coverage */
            object-fit: cover;
            object-position: center;
            z-index: 0;
        }

        /* FIXED OVERLAY MASK */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 1;
        }

        /* BRAND CONTENT CONTAINER */
        .brand-header {
            text-align: center;
            opacity: 0;
            animation: fadeInFromTop 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 2;
            margin-bottom: 50px;
        }

        .gold-text {
            color: #BF953F; 
            font-size: 4rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 700;
            text-shadow: 0 0 35px rgba(191, 149, 63, 0.3);
        }

        .sub-text {
            color: #ffffff;
            letter-spacing: 6px;
            margin-top: 15px;
            text-transform: uppercase;
            font-size: 1rem;
            opacity: 0.8;
        }

        /* PREMIUM CALL TO ACTION BUTTON */
        .enter-btn {
            padding: 18px 60px;
            background: transparent;
            color: #BF953F;
            border: 1px solid #BF953F;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            animation: fadeIn 1.2s ease 1.2s forwards;
            cursor: pointer;
            z-index: 2;
            border-radius: 4px;
            backdrop-filter: blur(5px); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .enter-btn:hover {
            background: #BF953F;
            color: #000;
            box-shadow: 0 0 40px rgba(191, 149, 63, 0.6);
            transform: scale(1.05) translateY(-2px);
        }

        /* TIMING & STRUCTURAL ANIMATIONS */
        @keyframes fadeIn { 
            to { opacity: 1; } 
        }

        @keyframes fadeInFromTop {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 600px) {
            .video-background {
                width: 100vw;
                height: 100vh;
                /* Adjust focus to make sure the car stays in frame on narrow screens */
                object-fit: cover;
                object-position: 32% center; 
            }
            .gold-text { 
                font-size: 2.5rem; 
                letter-spacing: 6px; 
            }
            .sub-text {
                font-size: 0.85rem;
                letter-spacing: 4px;
            }
            .enter-btn {
                padding: 14px 45px;
                font-size: 0.85rem;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- Cinematic background video element loop -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/74/74-720.mp4" type="video/mp4">
    </video>
    
    <!-- Privacy layer ensuring sharp contrast -->
    <div class="video-overlay"></div>

    <div class="brand-header">
        <h1 class="gold-text">Sarkin Mota</h1>
        <p class="sub-text">Premium Auto Dealership</p>
    </div>

    <a href="{% url 'car_list' %}" class="enter-btn">Enter Showroom</a>

</body>
</html>
